data:
  version: 1
  project: chama
  resources:
    # Curated demonstration aggregation, not one provenance-based fonds.
    - iri: ChamaRailwayHeritageDemo
      class: shared:ArchiveUnit
      properties:
        schema:name:
          - value: Chama Railway Heritage Demo
            language: en
          - value: Demoarchiv zur Eisenbahngeschichte von Chama
            language: de
        shared:archiveLevel:
          - iri: shared:ArchiveGroup
        schema:identifier:
          - value: CHAMA-DEMO
        schema:description:
          - value: >-
              Kuratierte Demonstrationsstruktur für unterschiedliche
              historische und zeitgenössische Quellen zur Eisenbahn in und um
              Chama, New Mexico. Die Bestandsgruppe dient der Erprobung des
              generischen SALSAH-Archivmodells und stellt keinen institutionell
              gewachsenen Provenienzbestand dar.
            language: de
          - value: >-
              Curated demonstration structure for heterogeneous historical and
              contemporary sources concerning the railway in and around Chama,
              New Mexico. The archive group tests SALSAH's generic archive model
              and does not claim to be an organically accumulated fonds.
            language: en
        schema:materialExtent:
          - value: Kleine, schrittweise wachsende digitale Demonstrationssammlung
            language: de
          - value: Small incrementally growing digital demonstration collection
            language: en
        dcterms:provenance:
          - value: >-
              Für die Entwicklung und Prüfung von SALSAH 2 aus Material
              verschiedener Herkunft zusammengestellt.
            language: de
        schema:conditionsOfAccess:
          - value: >-
              Für die öffentliche SALSAH-Demo freigegebene Datensätze; die
              technische Zugriffsentscheidung erfolgt ausschliesslich über die
              OLDAP-Rollen und -Berechtigungen.
            language: de
        schema:position:
          - value: 1
      permissions:
        oldap:Unknown: DATA_VIEW

    - iri: LukasRosenthalerRailwayPhotographs
      class: shared:ArchiveUnit
      properties:
        schema:name:
          - value: Eisenbahnfotografien von Lukas Rosenthaler
            language: de
          - value: Railway photographs by Lukas Rosenthaler
            language: en
        shared:archiveLevel:
          - iri: shared:Series
        shared:parentArchiveUnit:
          - iri: chama:ChamaRailwayHeritageDemo
        schema:identifier:
          - value: CHAMA-LR
        schema:description:
          - value: >-
              Born-digitale Eigenaufnahmen von Lukas Rosenthaler aus Chama und
              von der Cumbres & Toltec Scenic Railroad.
            language: de
        dcterms:creator:
          - iri: chama:LukasRosenthaler
        dcterms:provenance:
          - value: >-
              Vom Fotografen aus seinem persönlichen Bestand für die
              SALSAH-Demo bereitgestellt und beschrieben.
            language: de
        schema:position:
          - value: 1
      permissions:
        oldap:Unknown: DATA_VIEW

