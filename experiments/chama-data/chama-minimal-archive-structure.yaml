    - iri: RuediSingerRailwayPhotographs1981
      class: shared:ArchiveUnit
      properties:
        schema:name:
          - value: Eisenbahnfotografien von Ruedi Singer, 1981
            language: de
          - value: Railway photographs by Ruedi Singer, 1981
            language: en
        shared:archiveLevel:
          - iri: shared:Series
        shared:parentArchiveUnit:
          - iri: chama:ChamaRailwayHeritageDemo
        schema:identifier:
          - value: CHAMA-RS-1981
        schema:description:
          - value: >-
              Fotografien von Ruedi Singer von der gemeinsamen USA-Reise im
              Jahr 1981. Vorhandene analoge Aufnahmen werden als eigenständige
              archivische Items mit ihren Trägern und Digitalisaten erschlossen.
            language: de
        dcterms:temporal:
          - value: "1981"
        dcterms:creator:
          - iri: chama:RuediSinger
        dcterms:provenance:
          - value: >-
              Fotografiert von Ruedi Singer und später von Lukas Rosenthaler
              digitalisiert; die differenzierten Rollen bleiben an Werk,
              Träger und digitaler Repräsentation dokumentiert.
            language: de
        schema:position:
          - value: 2
      permissions:
        oldap:Unknown: DATA_VIEW
