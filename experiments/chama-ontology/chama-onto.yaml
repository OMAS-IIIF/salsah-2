ontology:
  project:
    shortname: chama
    iri: https://chama.salsah.org
    namespace: https://chama.salsah.org/ns/
    start: '2026-08-23'
    label:
      en: SALSAH 2 Chama Demo
      de: SALSAH-2-Chama-Demo
    comment:
      en: Demonstration project for testing generic SALSAH 2 archive, media, discovery, and narrative workflows with historical railway material from Chama, New Mexico.
      de: Demonstrationsprojekt zur Erprobung generischer Archiv-, Medien-, Such- und Erzählworkflows von SALSAH 2 mit historischem Eisenbahnmaterial aus Chama, New Mexico.

  external_ontologies:
    dcterms:
      namespace: http://purl.org/dc/terms/
      label: Dublin Core
      proposedResourceClass:
        - Agent
      proposedDatatypePropertyClass:
        - created
      proposedObjectPropertyClass:
        - contributor
        - creator
        - temporal
    schema:
      namespace: https://schema.org/
      label: schema.org
      proposedResourceClass:
        - Organization
        - Person
        - Place
      proposedDatatypePropertyClass:
        - description
        - identifier
        - name

  classes:
    chama:Agent:
      superclass:
        - dcterms:Agent
      label:
        en: Agent
        de: Akteur
        fr: Agent
        it: Agente
      comment:
        en: A person or organization participating in the creation, provision, description, operation, or rights context of a Chama resource.
      properties: []

    chama:Person:
      superclass:
        - schema:Person
        - chama:Agent
      label:
        en: Person
        de: Person
        fr: Personne
        it: Persona
      properties:
        - iri: schema:name
          datatype: rdf:langString
          name:
            en: Name
            de: Name
            fr: Nom
            it: Nome
          min_count: 1
          unique_lang: true
          order: 1
          editor: TEXT_FIELD_WITH_LANG

    chama:Organization:
      superclass:
        - schema:Organization
        - chama:Agent
      label:
        en: Organization
        de: Organisation
        fr: Organisation
        it: Organizzazione
      properties:
        - iri: schema:name
          datatype: rdf:langString
          name:
            en: Name
            de: Name
            fr: Nom
            it: Nome
          min_count: 1
          unique_lang: true
          order: 1
          editor: TEXT_FIELD_WITH_LANG

    chama:Place:
      superclass:
        - schema:Place
      label:
        en: Place
        de: Ort
        fr: Lieu
        it: Luogo
      properties:
