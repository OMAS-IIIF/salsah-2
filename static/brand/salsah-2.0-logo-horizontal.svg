<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title description">
  <title id="title">SALSAH 2.0 logo</title>
  <desc id="description">Four archival source fragments linked through an annotation node, followed by the SALSAH 2.0 wordmark.</desc>

  <defs>
    <style>
      .source-line { fill: none; stroke: #173653; stroke-width: 9; stroke-linecap: round; }
      .accent-line { fill: none; stroke: #24b8b2; stroke-width: 9; stroke-linecap: round; }
      .text-line { fill: none; stroke: #ffffff; stroke-width: 8; stroke-linecap: round; }
      .paper-line { fill: none; stroke: #aa8568; stroke-width: 8; stroke-linecap: round; }
      .wordmark { fill: #112c46; font-family: Baskerville, "Libre Baskerville", Georgia, serif; font-size: 176px; font-weight: 600; letter-spacing: 8px; }
      .version { fill: #c86f43; font-family: Avenir, "Avenir Next", Helvetica, Arial, sans-serif; font-size: 84px; font-weight: 400; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Linked archival sources -->
  <g id="symbol" aria-label="Linked source and annotation symbol">
    <path class="source-line" d="M230 139 L319 213" />
    <path class="source-line" d="M318 102 L319 213" />
    <path class="source-line" d="M230 282 L319 213" />
    <path class="source-line" d="M360 275 L319 213" />
    <path class="accent-line" d="M319 213 L501 149" />

    <!-- Copper source fragment -->
    <path d="M58 48 H211 L247 84 V157 Q247 170 234 170 H71 Q58 170 58 157 Z" fill="#c86f43" />
    <path d="M211 48 V84 H247" fill="#e7a17c" />
    <path class="text-line" d="M91 87 H197 M91 112 H197 M91 137 H168" />

    <!-- Parchment source fragment -->
    <path d="M282 38 Q282 28 294 27 Q308 32 320 26 Q337 33 352 26 Q369 32 385 27 Q399 30 399 43 V144 Q399 157 386 157 H295 Q282 157 282 144 Z" fill="#eee7dc" />
    <path class="paper-line" d="M309 76 H370 M309 104 H362" />

    <!-- Navy source fragment -->
    <path d="M58 236 H207 L240 269 V346 Q240 359 227 359 H71 Q58 359 58 346 Z" fill="#112c46" />
    <path d="M207 236 V269 H240" fill="#294b69" />
    <path class="text-line" d="M89 279 H173 M89 306 H198 M89 333 H183" />

    <!-- Parchment fragment with humanistic leaf -->
    <path d="M314 225 H405 L442 262 V349 Q442 362 429 362 H327 Q314 362 314 349 Z" fill="#ded2bf" />
    <path d="M405 225 V262 H442" fill="#eee7dc" />
    <path d="M345 337 C369 316 383 292 390 265" fill="none" stroke="#ad8e6e" stroke-width="6" stroke-linecap="round" />
    <path d="M366 312 C348 307 341 295 345 283 C359 287 368 296 366 312 Z" fill="#ad8e6e" />
    <path d="M380 291 C367 281 366 268 375 257 C387 266 390 277 380 291 Z" fill="#ad8e6e" />
    <path d="M355 329 C341 328 332 320 332 308 C346 308 355 316 355 329 Z" fill="#ad8e6e" />

    <!-- Central annotation point -->
    <circle cx="319" cy="213" r="43" fill="#112c46" />
    <circle cx="319" cy="213" r="31" fill="#24b8b2" />
    <circle cx="319" cy="213" r="13" fill="#ffffff" />

    <!-- Open linkage endpoint -->
    <circle cx="511" cy="145" r="24" fill="#ffffff" stroke="#24b8b2" stroke-width="9" />
  </g>

  <!-- Wordmark -->
  <g id="wordmark">
    <text class="wordmark" x="560" y="267">SALSAH</text>
    <text class="version" x="1375" y="266">2.0</text>
  </g>
</svg>
